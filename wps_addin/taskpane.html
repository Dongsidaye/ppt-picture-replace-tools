<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片原位替换</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 18px; color: #222; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    p { line-height: 1.55; color: #555; }
    input, button { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 9px; }
    button { border: 0; border-radius: 4px; background: #1677ff; color: white; cursor: pointer; }
    button:disabled { background: #a9c7f7; cursor: wait; }
    #status { white-space: pre-wrap; margin-top: 14px; font-size: 13px; }
  </style>
</head>
<body>
  <h2 id="title">图片原位替换</h2>
  <p id="hint">选择图片文件后，插件会保留当前图片的裁剪、位置和旋转等信息。</p>
  <input id="file" type="file" accept="image/*" />
  <button id="run" disabled>开始替换</button>
  <div id="status"></div>
  <script src="main.js"></script>
  <script>
    (function () {
      const batch = location.hash.toLowerCase() === "#batch";
      const title = document.getElementById("title");
      const hint = document.getElementById("hint");
      const input = document.getElementById("file");
      const run = document.getElementById("run");
      const status = document.getElementById("status");
      title.textContent = batch ? "批量用文件替换" : "文件原位替换";
      hint.textContent = batch
        ? "选择新图片，插件会在全部幻灯片中查找同源图片，并逐个保留原裁剪。"
        : "选择一张新图片，替换当前选中的图片并保留原裁剪。";
      input.addEventListener("change", function () { run.disabled = !input.files.length; });
      run.addEventListener("click", async function () {
        run.disabled = true;
        status.textContent = "正在读取图片并替换，请稍候…";
        try {
          const path = await window.WpsPictureReplace.writeBrowserFile(input.files[0]);
          if (batch) {
            const count = await window.WpsPictureReplace.replaceAllFromFile(path);
            status.textContent = "批量替换完成：成功 " + count + " 张。";
          } else {
            await window.WpsPictureReplace.replaceSelectedFromFile(path);
            status.textContent = "原位替换完成。";
          }
        } catch (error) {
          status.textContent = "替换失败：" + (error && error.message ? error.message : error);
        } finally {
          run.disabled = false;
        }
      });
    }());
  </script>
</body>
</html>
