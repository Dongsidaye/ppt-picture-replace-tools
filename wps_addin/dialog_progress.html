<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>图片替换进度</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      margin: 0; padding: 16px 18px; color: #1f2328; background: #fff; font-size: 13px;
    }
    h3 { margin: 0 0 12px; font-size: 15px; }
    .bar { height: 10px; background: #e8edf2; border-radius: 5px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #1677ff; transition: width .15s; }
    #text { font-size: 12px; color: #57606a; margin: 9px 0 14px; min-height: 18px; word-break: break-all; }
    #text.done { color: #1a7f37; font-weight: 600; }
    #text.err { color: #cf222e; font-weight: 600; }
    .btns { text-align: right; }
    button { border: 1px solid #d0d7de; background: #fff; border-radius: 6px; padding: 5px 18px; cursor: pointer; font-size: 12px; }
    button:hover { background: #f6f8fa; }
    #cancelBtn:hover { background: #ffebe9; border-color: #cf222e; color: #cf222e; }
    #cancelBtn:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <h3 id="title">正在替换图片…</h3>
  <div class="bar"><div id="fill"></div></div>
  <div id="text">准备中…</div>
  <div class="btns">
    <button id="cancelBtn">取消</button>
    <button id="closeBtn" style="display:none">关闭</button>
  </div>
  <script src="main.js"></script>
  <script>
    (function () {
      "use strict";
      var W = window.WpsPictureReplace;
      var cancelRequested = false;
      var titleEl = document.getElementById("title");
      var fillEl = document.getElementById("fill");
      var textEl = document.getElementById("text");
      var cancelBtn = document.getElementById("cancelBtn");
      var closeBtn = document.getElementById("closeBtn");
      function show(done, total, label) {
        if (total > 0) {
          var pct = Math.max(0, Math.min(100, Math.round(done * 100 / total)));
          fillEl.style.width = pct + "%";
          textEl.textContent = (label ? label + " · " : "") + done + " / " + total + "（" + pct + "%）";
        } else {
          textEl.textContent = label || "正在处理…";
        }
      }
      function finish(message, isError) {
        fillEl.style.width = "100%";
        textEl.textContent = message;
        textEl.className = isError ? "err" : "done";
        cancelBtn.style.display = "none";
        closeBtn.style.display = "inline-block";
      }
      closeBtn.addEventListener("click", function () { try { window.close(); } catch (_) {} });
      cancelBtn.addEventListener("click", function () {
        cancelRequested = true;
        cancelBtn.disabled = true;
        textEl.textContent = "正在取消，请稍候…";
      });
      var hash = "";
      try { hash = decodeURIComponent((window.location.hash || "").replace(/^#/, "")); } catch (_) { hash = (window.location.hash || "").replace(/^#/, ""); }
      var parts = hash.split("|");
      var cmd = parts[0];
      var param = parts.length > 1 ? decodeURIComponent(parts[1]) : "";
      var work = null;
      if (!W) {
        finish("插件核心加载失败，请重启 WPS 后重试。", true);
        return;
      }
      if (cmd === "replaceAllFromFile" && param) {
        titleEl.textContent = "批量文件替换";
        work = function () {
          return W.replaceAllFromFile(param, function (d, t, l) { show(d, t, l); }, function () { return cancelRequested; });
        };
      } else if (cmd === "replaceAllFromClipboard") {
        titleEl.textContent = "批量剪贴板替换";
        work = function () {
          return W.replaceAllFromClipboard(function (d, t, l) { show(d, t, l); }, function () { return cancelRequested; });
        };
      }
      if (!work) {
        finish("无法识别的替换任务。", true);
        return;
      }
      Promise.resolve().then(function () { return work(); }).then(function (result) {
        if (!result) { finish("任务完成。"); return; }
        var msg;
        if (result.cancelled) {
          msg = "已取消：完成 " + (result.success || 0) + " 张后停止";
        } else {
          msg = "匹配 " + (result.matched || 0) + " 张，成功 " + (result.success || 0) + " 张，失败 " + (result.failed || 0) + " 张";
        }
        finish(msg, !!result.failed || !!result.cancelled);
      }).catch(function (error) {
        finish("替换失败：" + (error && error.message ? error.message : error), true);
      });
    }());
  </script>
</body>
</html>
